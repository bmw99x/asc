[project]
name = "asc"
version = "0.1.0"
description = "Azure App Service Config TUI — manage app settings in your terminal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "textual>=1.0",
    "pydantic>=2.0",
    "typer>=0.12.0",
]

[project.scripts]
asc = "asc.app:main"
asc-autoconfig = "asc.tools.autoconfig.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asc"]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "ty>=0.0.1a9",
    "pytest>=8",
    "textual-dev>=1.0",
    "pytest-asyncio>=1.3.0",
    "typer[all]>=0.12.0",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ty.environment]
python = ".venv/bin/python"
